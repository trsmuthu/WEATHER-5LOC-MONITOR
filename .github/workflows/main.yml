name: 5-Location Weather & Environmental Monitor

on:
  schedule:
    # Runs automatically every 3 hours, 24/7/365
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Push 5-Location Weather
        env:
          NTFY_TOPIC: weather-5loc-muthu
        run: |
          python3 monitor.py
