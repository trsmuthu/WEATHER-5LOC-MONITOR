name: 5-Location Weather & Environmental Monitor

on:
    # Runs reliably every hour (Standard POSIX cron)
  workflow_dispatch: # Allows manual 1-click check anytime

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Push 5-Location Weather
        env:
          NTFY_TOPIC: weather-5loc-muthu
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 monitor.py
