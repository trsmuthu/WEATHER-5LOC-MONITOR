name: 5-Location Weather & Environmental Monitor

on:
  schedule:
    # Runs every 1 hour strictly from 7:05 AM IST to 7:05 PM IST (01:35 to 13:35 UTC)
    - cron: '35 1-13 * * *'
  workflow_dispatch: # Allows manual 1-click check anytime

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Push 5-Location Weather
        env:
          NTFY_TOPIC: weather-5loc-muthu
        run: |
          python3 monitor.py
